<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320">
  <defs>
    <!-- Gradient Background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f0f;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f0f0f;stop-opacity:1" />
    </linearGradient>
    
    <!-- YouTube Red Gradient -->
    <linearGradient id="ytRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff0000;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cc0000;stop-opacity:1" />
    </linearGradient>
    
    <!-- Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.03"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="1280" height="320" fill="url(#bgGrad)"/>
  <rect width="1280" height="320" fill="url(#grid)"/>
  
  <!-- Decorative Elements - Left Side -->
  <g opacity="0.08">
    <!-- Abstract circuit-like lines -->
    <path d="M-50,160 Q100,80 250,160 T550,160" fill="none" stroke="#ff0000" stroke-width="2"/>
    <path d="M-50,200 Q150,120 300,200 T600,200" fill="none" stroke="#3ea6ff" stroke-width="1.5"/>
    <circle cx="250" cy="160" r="4" fill="#ff0000"/>
    <circle cx="550" cy="160" r="4" fill="#ff0000"/>
    <circle cx="300" cy="200" r="3" fill="#3ea6ff"/>
    <circle cx="600" cy="200" r="3" fill="#3ea6ff"/>
  </g>
  
  <!-- Main Content Group -->
  <g transform="translate(640, 160)">
    
    <!-- YouTube Logo Icon -->
    <g transform="translate(-420, -60)">
      <rect x="0" y="0" width="120" height="84" rx="18" ry="18" fill="url(#ytRed)" filter="url(#glow)"/>
      <polygon points="48,28 48,56 78,42" fill="white"/>
    </g>
    
    <!-- Title -->
    <text x="-270" y="-15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" fill="white" letter-spacing="-1">
      YouTube Homepage Suite
    </text>
    
    <!-- Version Badge -->
    <g transform="translate(330, -35)">
      <rect x="0" y="0" width="100" height="32" rx="6" fill="#3ea6ff" opacity="0.15"/>
      <rect x="0" y="0" width="100" height="32" rx="6" fill="none" stroke="#3ea6ff" stroke-width="1.5" opacity="0.6"/>
      <text x="50" y="22" font-family="monospace" font-size="16" font-weight="700" fill="#3ea6ff" text-anchor="middle">v8.1.0</text>
    </g>
    
    <!-- Subtitle -->
    <text x="-270" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400" fill="#aaaaaa">
      Das modulare Power-User-Toolkit für YouTube
    </text>
    
    <!-- Feature Tags -->
    <g transform="translate(-270, 55)">
      <!-- Tag 1: Feed Filter -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="110" height="28" rx="14" fill="#ff0000" opacity="0.15"/>
        <rect x="0" y="0" width="110" height="28" rx="14" fill="none" stroke="#ff0000" stroke-width="1" opacity="0.4"/>
        <text x="55" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#ff6b6b" text-anchor="middle">🎯 Feed Filter</text>
      </g>
      
      <!-- Tag 2: Player Control -->
      <g transform="translate(125, 0)">
        <rect x="0" y="0" width="130" height="28" rx="14" fill="#3ea6ff" opacity="0.15"/>
        <rect x="0" y="0" width="130" height="28" rx="14" fill="none" stroke="#3ea6ff" stroke-width="1" opacity="0.4"/>
        <text x="65" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#6bc1ff" text-anchor="middle">🎮 Player Control</text>
      </g>
      
      <!-- Tag 3: Declutter -->
      <g transform="translate(270, 0)">
        <rect x="0" y="0" width="115" height="28" rx="14" fill="#00d084" opacity="0.15"/>
        <rect x="0" y="0" width="115" height="28" rx="14" fill="none" stroke="#00d084" stroke-width="1" opacity="0.4"/>
        <text x="57.5" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#4de8a0" text-anchor="middle">🧹 Declutter</text>
      </g>
      
      <!-- Tag 4: SponsorBlock -->
      <g transform="translate(400, 0)">
        <rect x="0" y="0" width="130" height="28" rx="14" fill="#ff6b00" opacity="0.15"/>
        <rect x="0" y="0" width="130" height="28" rx="14" fill="none" stroke="#ff6b00" stroke-width="1" opacity="0.4"/>
        <text x="65" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#ff9e4d" text-anchor="middle">🛡️ SponsorBlock</text>
      </g>
      
      <!-- Tag 5: Shortcuts -->
      <g transform="translate(545, 0)">
        <rect x="0" y="0" width="115" height="28" rx="14" fill="#a855f7" opacity="0.15"/>
        <rect x="0" y="0" width="115" height="28" rx="14" fill="none" stroke="#a855f7" stroke-width="1" opacity="0.4"/>
        <text x="57.5" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#c084fc" text-anchor="middle">⌨️ Shortcuts</text>
      </g>
    </g>
  </g>
  
  <!-- Right Side Decorative -->
  <g opacity="0.06" transform="translate(1100, 160)">
    <circle cx="0" cy="-80" r="60" fill="none" stroke="#ff0000" stroke-width="2"/>
    <circle cx="40" cy="40" r="40" fill="none" stroke="#3ea6ff" stroke-width="2"/>
    <circle cx="-30" cy="60" r="30" fill="none" stroke="#00d084" stroke-width="2"/>
  </g>
  
  <!-- Bottom Bar -->
  <rect x="0" y="310" width="1280" height="10" fill="url(#ytRed)" opacity="0.8"/>
</svg>
